<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Puzzles: free cybersecurity practice</title>
<style>
  /* ---------- 1. COLORS AND FONT (change the look here) ---------- */
  :root {
    --bg: #0d1117;        /* page background */
    --panel: #161b22;     /* boxes */
    --line: #2b3340;      /* borders */
    --text: #d7e0ea;      /* main text */
    --dim: #8a97a8;       /* quiet text */
    --accent: #5eead4;    /* teal: main highlight */
    --warn: #fbbf24;      /* amber: hints, warnings */
    --font: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  /* ---------- 2. LAYOUT ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }

  /* top bar stays visible so the score is always in view */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .topbar .wrap {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 12px; padding-bottom: 12px; gap: 12px;
  }
  .brand { color: var(--accent); font-weight: 700; cursor: pointer; background: none; border: 0; font: inherit; padding: 0; }
  .brand::before { content: "$ "; color: var(--dim); }
  .score { color: var(--text); }
  .score b { color: var(--accent); font-size: 1.15em; }

  h1 { font-size: 1.4rem; margin: 28px 0 6px; }
  h2 { font-size: 1.15rem; margin: 24px 0 8px; }
  p  { margin: 0 0 12px; }
  .dim { color: var(--dim); }

  /* ---------- 3. BUTTONS AND MENU CARDS ---------- */
  button { font-family: var(--font); font-size: 1rem; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .menu { display: grid; gap: 12px; margin-top: 20px; }
  .menu button {
    text-align: left; width: 100%;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 4px; padding: 14px 16px;
  }
  .menu button:hover { border-color: var(--accent); }
  .menu .name { display: block; color: var(--accent); font-weight: 700; }
  .menu .what { display: block; color: var(--dim); font-size: 0.9rem; margin-top: 2px; }

  .btn {
    background: var(--accent); color: #04211d; border: 0;
    border-radius: 4px; padding: 10px 18px; font-weight: 700;
  }
  .btn.ghost { background: none; color: var(--text); border: 1px solid var(--line); font-weight: 400; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 16px; margin-top: 16px; }
  .note { border-left: 3px solid var(--warn); padding-left: 12px; color: var(--dim); }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <button class="brand" id="homeBtn">cyber-puzzles</button>
    <div class="score">Score: <b id="scoreNum">0</b></div>
  </div>
</header>

<main class="wrap">

  <!-- SCREEN A: the menu -->
  <section id="menuScreen">
    <h1>Learn cybersecurity by solving it.</h1>
    <p class="dim">Short puzzles for students and professionals. Free. No login.</p>
    <div class="menu" id="menuList"></div>
    <div class="row"><button class="btn ghost" id="resetBtn">Reset score</button></div>
  </section>

  <!-- SCREEN B: a puzzle -->
  <section id="puzzleScreen" hidden>
    <h1 id="puzzleTitle"></h1>
    <p class="dim" id="roundLabel"></p>
    <div id="puzzleArea" class="panel"></div>
    <div class="row">
      <button class="btn" id="nextBtn">Next</button>
      <button class="btn ghost" id="backBtn">Back to menu</button>
    </div>
  </section>

</main>

<script>
/* ---------- 4. THE PUZZLE LIST ----------
   Each puzzle is one entry. To add a new puzzle later, you add one more entry here.
   "render" is a small function that draws the puzzle for a given round number. */
const puzzles = [
  {
    id: "phish",
    title: "Spot the Phish",
    blurb: "Tap the red flags in an email. Some are clean.",
    rounds: 3,
    render: (area, round, addPoints) => placeholder(area, round, addPoints)
  },
  {
    id: "cipher",
    title: "Decode the Cipher",
    blurb: "Crack Caesar, Base64 and substitution ciphers.",
    rounds: 3,
    render: (area, round, addPoints) => placeholder(area, round, addPoints)
  }
];

/* Temporary stand-in so you can test the score and Next button.
   We will replace it with the real puzzles in the next steps. */
function placeholder(area, round, addPoints) {
  area.innerHTML =
    "<p>Round " + (round + 1) + " goes here.</p>" +
    '<p class="note">Test mode: the real puzzle arrives in the next step.</p>' +
    '<div class="row"><button class="btn" id="testPoint">Test: earn 1 point</button></div>';
  document.getElementById("testPoint").onclick = function () {
    addPoints(1);
    this.disabled = true;
  };
}

/* ---------- 5. THE GAME'S MEMORY ---------- */
let score = 0;            // running total
let current = null;       // which puzzle is open
let round = 0;            // which round of that puzzle

/* ---------- 6. SHORTCUTS TO PAGE PARTS ---------- */
const $ = (id) => document.getElementById(id);

/* ---------- 7. WHAT THE BUTTONS DO ---------- */
function addPoints(n) {
  score += n;
  if (score < 0) score = 0;      // score never goes below zero
  $("scoreNum").textContent = score;
}

function showMenu() {
  current = null;
  $("puzzleScreen").hidden = true;
  $("menuScreen").hidden = false;
  window.scrollTo(0, 0);
}

function openPuzzle(p) {
  current = p;
  round = 0;
  $("menuScreen").hidden = true;
  $("puzzleScreen").hidden = false;
  $("puzzleTitle").textContent = p.title;
  drawRound();
  window.scrollTo(0, 0);
}

function drawRound() {
  $("roundLabel").textContent = "Round " + (round + 1) + " of " + current.rounds;
  $("nextBtn").textContent = round + 1 === current.rounds ? "Finish" : "Next";
  current.render($("puzzleArea"), round, addPoints);
}

function next() {
  if (round + 1 >= current.rounds) { showMenu(); return; }  // last round: go back to menu
  round += 1;
  drawRound();
}

/* ---------- 8. BUILD THE MENU AND CONNECT EVERYTHING ---------- */
puzzles.forEach(function (p) {
  const b = document.createElement("button");
  b.innerHTML = '<span class="name">' + p.title + '</span><span class="what">' + p.blurb + "</span>";
  b.onclick = function () { openPuzzle(p); };
  $("menuList").appendChild(b);
});

$("nextBtn").onclick = next;
$("backBtn").onclick = showMenu;
$("homeBtn").onclick = showMenu;
$("resetBtn").onclick = function () { score = 0; addPoints(0); };
</script>
</body>
</html>
